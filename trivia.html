<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Celebration Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
  <div>
    <div id="team-setup">
      <h2>🎉 Family Trivia Game</h2>
      <div>
        <label>Team 1 Name:</label>
        <input id="team1" />
      </div>
      <div>
        <label>Team 2 Name:</label>
        <input id="team2" />
      </div>
      <button onclick="startGame()">Start Game</button>
    </div>

    <div id="trivia-game" style="display: none;">
      <div>
        <h4><span id="team1-name"></span>: <span id="team1-score">0</span></h4>
        <h4><span id="team2-name"></span>: <span id="team2-score">0</span></h4>
      </div>

      <h5 id="question-type"></h5>
      <h3 id="question"></h3>
      <div id="answers"></div>

      <div id="result"></div>
      <button id="next-btn" style="display: none;" onclick="nextQuestion()">Next Question</button>
    </div>
  </div>

  <script>
   const triviaData = [
  // Multiple Choice
  { type: "trivia", question: "Who is the oldest sibling?", options: ["Nobesuthu", "Sindiswa", "Noluthando", "Siyabonga"], correct: "Nobesuthu" },
  { type: "trivia", question: "In this year, which baby was born first? (1990)", options: ["Mpumie", "Khanya", "Vuyani", "Nosiphiwo"], correct: "Nosiphiwo" },
  { type: "trivia", question: "In this year, which baby was born first?(2025)", options: ["Baby Iyana", "Baby Azosule", "Baby Lukhetho", "Baby Omi"], correct: "Baby Azosule" },
  { type: "trivia", question: "Who is known for giving the most beatting?", options: ["Uncle Siyabonga", "Wowowo", "Noluthando", "Sindiswa"], correct: "Uncle Siyabonga" },
  // Who Said It
  { type: "quote", question: "\"Ungathi uyive ngam ke noMama\"", options: ["corret answer:  Makhulu/Wowowo", "wrong" ], correct: "corret answer:  Makhulu/Wowowo" },
  { type: "quote", question: "\"Hambo lala Hlumelo\"", options: ["corret answer:  Nosiphiwo", "wrong"], correct: "corret answer:  Nosiphiwo" },
  { type: "quote", question: "\"English in action I want to learn\"", options: ["corret answer:  Magubevu", "wrong"], correct: "corret answer:  Magubevu" },
  { type: "quote", question: "\"Even if you make it harder, you're gonna get killed, If you're smooth you're about to get killed. Never be nice, never be good. Just be you\"", options: ["corret answer:  Samson", "wrong"], correct: "corret answer:  Samson" },
  


  // Guess the Person
  { type: "identity", question: "They’re not defined by achievements on paper, but by how they show up wholeheartedly. Whether making sure everyone laughs or simply feels seen, they hold things down like it’s second nature. Beneath their steady presence is a quiet drive , always finding a way, always making things work, even when no one’s watching."
    , options: ["answer: Mpumie", "wrong"], correct: "answer: Mpumie" },
  { type: "identity", question: "They moved through their youth like a champion ,  court, field, or pitch, it didn’t matter. Trophies followed them. School wasn’t quite their stage, but they made it through. Known for explosive energy when pushed and a heart of gold when not, they were both the storm and the calm. Oh and when the music hit? Their moves always stole the spotlight."
    , options: ["answer: Mncedisi", "wrong"], correct: "answer: Mncedisi" },
  { type: "identity", question: "Their résumé tells a story of hands-on hustle  mostly in places where name tags are worn and the grill never cools. They're a natural scene-stealer, whether cracking jokes or stirring up just enough drama to be remembered."
, options: ["answer: Khanya/Matiti", "wrong"], correct: "answer: Khanya/Matiti" },
  { type: "identity", question: "Their laugh doesn’t just fill a room — it infects it. One burst and suddenly everyone’s cracking up, whether they heard the joke or not. It’s the kind of laugh you could bottle and sell as a service.", options: ["answer: Sivuyile/Alex", "wrong"], correct: "answer: Sivuyile/Alex" },
];
    let team1 = '';
    let team2 = '';
    let team1Score = 0;
    let team2Score = 0;
    let currentQuestion = 0;
    let firstAttemptFailed = false;

    function startGame() {
      team1 = document.getElementById('team1').value || "Team A";
      team2 = document.getElementById('team2').value || "Team B";

      document.getElementById('team1-name').textContent = team1;
      document.getElementById('team2-name').textContent = team2;

      document.getElementById('team-setup').style.display = 'none';
      document.getElementById('trivia-game').style.display = 'block';

      loadQuestion();
    }

    function loadQuestion() {
      const q = triviaData[currentQuestion];
      document.getElementById('question').textContent = q.question;
      document.getElementById('question-type').textContent = getQuestionTypeLabel(q.type);
      const answersDiv = document.getElementById('answers');
      answersDiv.innerHTML = '';

      q.options.forEach(option => {
        const btn = document.createElement('button');
        btn.textContent = option;
        btn.onclick = () => selectAnswer(option);
        answersDiv.appendChild(btn);
      });

      document.getElementById('result').textContent = '';
      document.getElementById('next-btn').style.display = 'none';
      firstAttemptFailed = false;
    }

    function getQuestionTypeLabel(type) {
      switch (type) {
        case "trivia": return "🎯 Trivia";
        case "quote": return "🗣️ Who Said It?";
        case "identity": return "👤 Guess Who?";
        default: return "";
      }
    }

    function selectAnswer(selected) {
      const correct = triviaData[currentQuestion].correct;
      const resultDiv = document.getElementById('result');

      if (selected === correct) {
        resultDiv.innerHTML = `
          ✅ Correct!
          <p>🏆 Who answered correctly?</p>
          <button onclick="awardPoint(1)">+1 to ${team1}</button>
          <button onclick="awardPoint(2)">+1 to ${team2}</button>
        `;
        disableButtons();
      } else {
        if (!firstAttemptFailed) {
          firstAttemptFailed = true;
          resultDiv.innerHTML = `⚠️ Wrong! Let the other team try!`;
          enableButtons();
        } else {
          resultDiv.innerHTML = `❌ Wrong again! Correct answer was: ${correct}`;
          disableButtons();
          document.getElementById('next-btn').style.display = 'inline';
        }
      }
    }

    function disableButtons() {
      document.querySelectorAll('#answers button').forEach(btn => btn.disabled = true);
    }

    function enableButtons() {
      document.querySelectorAll('#answers button').forEach(btn => btn.disabled = false);
    }

    function awardPoint(team) {
      if (team === 1) {
        team1Score++;
        document.getElementById('team1-score').textContent = team1Score;
      } else {
        team2Score++;
        document.getElementById('team2-score').textContent = team2Score;
      }

      document.getElementById('next-btn').style.display = 'inline';
      document.getElementById('result').innerHTML += `<p>✅ Point awarded to ${team === 1 ? team1 : team2}!</p>`;
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < triviaData.length) {
        loadQuestion();
      } else {
        showFinalScore();
      }
    }

    function showFinalScore() {
      const winner = team1Score > team2Score ? team1 : (team2Score > team1Score ? team2 : "It's a Tie!");

      document.getElementById('trivia-game').innerHTML = `
        <h2>🏁 Game Over!</h2>
        <p>${team1}: ${team1Score} points</p>
        <p>${team2}: ${team2Score} points</p>
        <h3>🎉 Winner: ${winner}</h3>
        <a href="">Play Again</a>
        <a href="index.html">Home</a>
      `;
    }
  </script>
</body>
</html>
